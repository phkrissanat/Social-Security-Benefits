<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#116b56"><meta name="description" content="ประเมินสิทธิประกันสังคมจากข้อมูลที่คุณกรอก พร้อมแหล่งอ้างอิงทางการ"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./style.css?v=45"><title>สิทธิประกันสังคม</title></head><body><main><section id="assess"><div class="page-heading"><h1>สิทธิประกันสังคม</h1><p class="assessment-note">ประเมินสิทธิเบื้องต้นตามประกาศของ สปส โปรดตรวจสอบกับหน่วยงานที่เกี่ยวข้องอีกครั้งเพื่อรับสิทธิ</p><button id="install" hidden>ติดตั้ง</button></div><div class="workspace"><form id="form" autocomplete="off"><div class="segments" role="group" aria-label="มาตราผู้ประกันตน"><button type="button" data-section="33" aria-pressed="true">มาตรา 33<small>ลูกจ้างในระบบ</small></button><button type="button" data-section="39" aria-pressed="false">มาตรา 39<small>ส่งประกันต่อ</small></button><button type="button" data-section="40" aria-pressed="false">มาตรา 40<small>อาชีพอิสระ</small></button><button type="button" data-section="none" aria-pressed="false">ไม่มีประกันสังคม</button></div><label id="option-wrap" hidden>ทางเลือกมาตรา 40<select id="option"><option value="1">ทางเลือก 1 · 70 บาท/เดือน</option><option value="2">ทางเลือก 2 · 100 บาท/เดือน</option><option value="3">ทางเลือก 3 · 300 บาท/เดือน</option></select></label><details id="profile" class="profile-panel" open><summary id="profile-summary">ข้อมูลคำนวณสิทธิ</summary><div id="assessment-fields"><label><span id="continuous-label">ส่งสมทบ ม.33/39 ต่อเนื่องกี่เดือน</span><input id="continuous" type="number" min="0" max="1200" step="1" inputmode="numeric" placeholder="เช่น 24"></label></div><div class="profile-fields"><label>อายุ (ปีเต็ม)<input id="profile-age" type="number" min="15" max="120" step="1" inputmode="numeric"></label>
<label>สถานะการทำงาน<select id="profile-work"></select></label>
<label hidden>วันที่คาดว่าจะออกจากงาน<input id="profile-planned-end" type="date"></label>
<label hidden>วันที่สิ้นสุดการจ้าง<input id="profile-ended" type="date"></label>
<label>เพศ<select id="profile-sex"><option value="">ไม่ระบุ</option><option value="female">หญิง</option><option value="male">ชาย</option></select></label>
<label data-profile="33 39" id="profile-wage-field"><span id="profile-wage-label">ค่าจ้างต่อเดือน (บาท)</span><input id="profile-wage" type="number" inputmode="decimal" min="0.01" step="0.01"></label>
<label data-profile="39">เดือนที่ส่ง ม.39 ล่าสุด (เว้นว่างถ้าส่ง ม.39 ทั้งหมด)<input id="profile-months39" type="number" inputmode="numeric" min="0" step="1"></label></div></details><p id="form-error" class="form-error" role="status" hidden></p></form><div class="result-panel"><section id="advisor" class="benefit-advisor" aria-live="polite" hidden></section><div id="result" aria-live="polite" tabindex="-1"></div></div></div></section></main><footer><a href="tel:1506">สปส. 1506</a></footer><script type="module" src="./app.js?v=45"></script></body></html>
